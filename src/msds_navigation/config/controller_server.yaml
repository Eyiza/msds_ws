controller_server: # Node for the controller server
  ros__parameters:
    use_sim_time: true # Use simulated time for testing
    controller_frequency: 20.0 # 20 times per second. Frequency at which the control loop executes.A higher frequency allows for more responsive control but may increase CPU usage.
    min_x_velocity_threshold: 0.001 # Minimum x velocity threshold for the robot to consider itself moving
    min_y_velocity_threshold: 0.001 # Minimum y velocity threshold for the robot to consider itself moving.
    min_theta_velocity_threshold: 0.001 # Minimum rotational velocity threshold for the robot to consider itself moving
    failure_tolerance: 0.3 # Maximum duration in seconds that the robot can be stationary before considering it a failure
    progress_checker_plugin: "progress_checker" # Plugin for checking progress towards the goal
    # The progress checker plugin is responsible for checking the controller doesn't fail/block and that the robot is making progress towards its goal.
    # The one listed here already exists in the nav2_controller package.
    goal_checker_plugins: ["general_goal_checker"] # List of goal checker plugins to use
    # The goal checker plugins are responsible for checking if the robot has reached its goal.
    controller_plugins: ["FollowPath"] # List of controller plugins to use
    # These plugins are responsible for controlling the robot's movement based on the planned path.
    odom_topic: /odometry/filtered # topic to subscribe to for the robot's odometry information

    # !-- Plugin Configurations --!

    # Progress checker parameters
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.5 # Radius around the goal within which the robot must move to be considered making progress
      movement_time_allowance: 10.0 # Time in seconds that the robot can be stationary before considering it a failure

    # Goal checker parameters
    general_goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.35 # Tolerance in the x and y directions for reaching the goal in meters
      yaw_goal_tolerance: 0.50 # Tolerance in the yaw direction for reaching the goal in radians
      stateful: True # Indicates whether to check for x y position tolerance after rotating to the goal orientation in case of minor localization errors.

    # Option 1 - Rotation Shim Controller and Regulated Pure Pursuit Controller
    FollowPath:
      plugin: "nav2_rotation_shim_controller::RotationShimController"
      primary_controller: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"

      angular_dist_threshold: 0.785
      forward_sampling_distance: 0.5
      angular_disengage_threshold: 0.3925
      rotate_to_heading_angular_vel: 0.8
      max_angular_accel: 1.0
      simulate_ahead_time: 1.0
      rotate_to_goal_heading: false

      # Primary controller parameters
      desired_linear_vel: 0.35 # Desired linear velocity in m/s
      lookahead_dist: 0.7
      min_lookahead_dist: 0.5
      max_lookahead_dist: 0.7
      lookahead_time: 1.5
      rotate_to_heading_angular_vel: 0.4
      transform_tolerance: 0.2
      use_velocity_scaled_lookahead_dist: true
      min_approach_linear_velocity: 0.05
      approach_velocity_scaling_dist: 0.6 # Distance at which the robot will start slowing down to approach the goal
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 1.5
      use_regulated_linear_velocity_scaling: true
      use_cost_regulated_linear_velocity_scaling: true
      regulated_linear_scaling_min_radius: 0.85
      regulated_linear_scaling_min_speed: 0.25
      use_fixed_curvature_lookahead: false
      curvature_lookahead_dist: 0.6
      use_rotate_to_heading: true
      rotate_to_heading_min_angle: 0.785
      max_angular_accel: 3.2
      max_robot_pose_search_dist: 10.0
      interpolate_curvature_after_goal: false
      cost_scaling_dist: 0.3
      cost_scaling_gain: 1.0
      inflation_cost_scaling_factor: 3.0
    
    # Option 2 - DWB Controller
    # FollowPath:
    #   plugin: "dwb_core::DWBLocalPlanner"
    #   debug_trajectory_details: True
    #   min_vel_x: 0.0
    #   min_vel_y: 0.0
    #   max_vel_x: 0.5
    #   max_vel_y: 0.3
    #   max_vel_theta: 1.0
    #   min_speed_xy: 0.0
    #   max_speed_xy: 0.4
    #   min_speed_theta: 0.0
    #   acc_lim_x: 2.5
    #   acc_lim_y: 2.3
    #   acc_lim_theta: 3.2
    #   decel_lim_x: -2.5
    #   decel_lim_y: -2.3
    #   decel_lim_theta: -3.2
    #   vx_samples: 20
    #   vy_samples: 15
    #   vtheta_samples: 20
    #   sim_time: 1.7
    #   linear_granularity: 0.05
    #   angular_granularity: 0.025
    #   transform_tolerance: 0.2
    #   xy_goal_tolerance: 0.25
    #   trans_stopped_velocity: 0.25
    #   short_circuit_trajectory_evaluation: True
    #   limit_vel_cmd_in_traj: False
    #   stateful: True
    #   critics: ["RotateToGoal", "Oscillation", "BaseObstacle", "GoalAlign", "PathAlign", "PathDist", "GoalDist","ObstacleFootprintCritic", "PreferForward", "Twirling"]
    #   BaseObstacle.scale: 0.02
