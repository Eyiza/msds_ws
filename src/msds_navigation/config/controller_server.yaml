# Local costmap configuration for the robot. This is used for local obstacle avoidance and path following.
# The costmap.yaml configuration file was copied and modified to create this configuration.
local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 5.0 # Updated much more frequently than the global costmap to allow for real-time obstacle avoidance.
      publish_frequency: 5.0 
      global_frame: odom # since this is a local info, it is relative to the robot's position in the odom frame.
      robot_base_frame: base_link
      use_sim_time: true
      rolling_window: true # Local cost map has a fized size and moves with the robot.
      # Width and height of the rolling window - 4m by 4m
      width: 4
      height: 4
      resolution: 0.05
      robot_radius: 0.3
      plugins: ["obstacle_layer", "denoise_layer", "inflation_layer"]
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.7
      denoise_layer:
        plugin: "nav2_costmap_2d::DenoiseLayer"
        enabled: true
        minimal_group_size: 2
        group_connectivity_type: 8
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: /scan_filtered
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 3.0
          raytrace_min_range: 0.1
          obstacle_max_range: 2.5
          obstacle_min_range: 0.1
      always_send_full_costmap: True
