controller_server: # Node for the controller server
  ros__parameters:
    use_sim_time: true # Use simulated time for testing
    controller_frequency: 20.0 # 20 times per second. Frequency at which the control loop executes.A higher frequency allows for more responsive control but may increase CPU usage.
    min_x_velocity_threshold: 0.001 # Minimum x velocity threshold for the robot to consider itself moving
    min_y_velocity_threshold: 0.001 # Minimum y velocity threshold for the robot to consider itself moving.
    min_theta_velocity_threshold: 0.001 # Minimum rotational velocity threshold for the robot to consider itself moving
    failure_tolerance: 0.3 # Maximum duration in seconds that the robot can be stationary before considering it a failure
    progress_checker_plugin: "progress_checker" # Plugin for checking progress towards the goal
    # The progress checker plugin is responsible for checking the controller doesn't fail/block and that the robot is making progress towards its goal.
    # The one listed here already exists in the nav2_controller package.
    goal_checker_plugins: ["general_goal_checker"] # List of goal checker plugins to use
    # The goal checker plugins are responsible for checking if the robot has reached its goal.
    controller_plugins: ["FollowPath"] # List of controller plugins to use
    # These plugins are responsible for controlling the robot's movement based on the planned path.
    odom_topic: /odometry/filtered # topic to subscribe to for the robot's odometry information

    # !-- Plugin Configurations --!

    # Progress checker parameters
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.5 # Radius around the goal within which the robot must move to be considered making progress
      movement_time_allowance: 10.0 # Time in seconds that the robot can be stationary before considering it a failure

    # Goal checker parameters
    general_goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.25 # Tolerance in the x and y directions for reaching the goal in meters
      yaw_goal_tolerance: 0.25 # Tolerance in the yaw direction for reaching the goal in radians
      stateful: True # Indicates whether to check for x y position tolerance after rotating to the goal orientation in case of minor localization errors.

    # RPP parameters - Regulated Pure Pursuit Controller
    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      desired_linear_vel: 0.3
      lookahead_dist: 0.6
      min_lookahead_dist: 0.3
      max_lookahead_dist: 0.9
      lookahead_time: 1.5
      rotate_to_heading_angular_vel: 1.8
      transform_tolerance: 0.2
      use_velocity_scaled_lookahead_dist: false
      min_approach_linear_velocity: 0.05
      approach_velocity_scaling_dist: 1.0
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 1.0
      use_regulated_linear_velocity_scaling: true
      use_cost_regulated_linear_velocity_scaling: false
      regulated_linear_scaling_min_radius: 0.9
      regulated_linear_scaling_min_speed: 0.25
      use_fixed_curvature_lookahead: false
      curvature_lookahead_dist: 1.0
      use_rotate_to_heading: true
      rotate_to_heading_min_angle: 0.785
      max_angular_accel: 3.2
      max_robot_pose_search_dist: 10.0
      interpolate_curvature_after_goal: false
      cost_scaling_dist: 0.3
      cost_scaling_gain: 1.0
      inflation_cost_scaling_factor: 3.0

# Local costmap configuration for the robot. This is used for local obstacle avoidance and path following.
# The costmap.yaml configuration file was copied and modified to create this configuration.
local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 5.0 # Updated much more frequently than the global costmap to allow for real-time obstacle avoidance.
      publish_frequency: 2.0 
      global_frame: odom # since this is a local info, it is relative to the robot's position in the odom frame.
      robot_base_frame: base_link
      use_sim_time: true
      rolling_window: true # Local cost map has a fized size and moves with the robot.
      # Width and height of the rolling window - 3m by 3m
      width: 3
      height: 3
      resolution: 0.05
      robot_radius: 0.3
      plugins: ["obstacle_layer", "inflation_layer"]
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.7
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: /scan_filtered
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0
      always_send_full_costmap: True
