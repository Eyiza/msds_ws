smoother_server: # Node for nav2_smoother, which is used to smooth the path generated by the planner.
  ros__parameters:
    use_sim_time: true # Use simulation time for the smoother server, useful in simulation environments.
    smoother_plugins: ["simple_smoother"] # List of smoother plugins to be used by the smoother server.
    # The smoother server will use these plugins to smooth the path generated by the planner.
    # The one listed here already exists in the nav2_smoother package.

    # !-- Plugin Configurations --!
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother" 
      tolerance: 1.0e-10 # Tolerance for the smoother, used to determine how much to smooth the path.
      max_its: 1000 # Maximum number of iterations for the smoother to attempt to smooth the path.
      do_refinement: true # Whether to recursively smooth the path to refine the qality even further.